name: Essai du modèle (ponctuel, à supprimer)

on:
  workflow_dispatch:
  push:
    paths:
      - "test_modele.py"
      - ".github/workflows/test-modele.yml"

permissions:
  contents: write

concurrency:
  group: events-feed
  cancel-in-progress: false

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les pages avec Haiku 5.5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 test_modele.py
      - name: Garder uniquement le résultat de l'essai
        if: always()
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add test_modele_resultat.json
          git commit -m "Essai du modèle : résultat" || exit 0
          git pull --rebase origin main
          git push
