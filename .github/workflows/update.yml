name: Mise à jour des événements

on:
  schedule:
    - cron: "0 4 * * *"   # tous les jours à 4 h UTC (5 h ou 6 h en Belgique)
  workflow_dispatch:        # bouton « Run workflow » pour le lancer à la main
  push:                     # se relance tout seul quand le code du robot change
    paths:
      - "build_events.py"
      - "page_text.py"
      - "sources.json"
      - "manual_events.json"

permissions:
  contents: write

# une seule exécution à la fois (évite les collisions à l'enregistrement)
concurrency:
  group: events-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les sources et construire events.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 build_events.py
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.json geocache.json rapport.json pages_cache.json places.json
          git diff --staged --quiet || (git commit -m "Mise à jour automatique des événements" && git push)
