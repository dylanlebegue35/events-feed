name: Mise à jour des événements

on:
  schedule:
    - cron: "0 4,10,16,22 * * *"   # quatre fois par jour : les propositions acceptées arrivent dans l'app en quelques heures
  workflow_dispatch:        # bouton « Run workflow » pour le lancer à la main
  push:                     # se relance tout seul quand le code du robot change
    branches: [main]        # seulement sur main : une branche d'essai ou un tag ne lance pas le robot (ni ses secrets, ni Apify)
    paths:
      - "build_events.py"
      - "build_sorties.py"
      - "page_text.py"
      - "sources.json"
      - "facebook_searches.json"
      - "manual_events.json"
      - "sponsors.json"
      - "inbox/**"

permissions:
  contents: write

# une seule exécution à la fois (évite les collisions à l'enregistrement)
concurrency:
  group: events-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # toujours partir de la dernière version de la branche au moment où le passage démarre (main en temps normal).
          # Sans ça, un passage mis en file d'attente repart de l'ancienne version qui l'a déclenché :
          # le 24/11, le passage de 15 h 26 a attendu celui de 15 h 21, qui venait d'écrire events.json ;
          # il est reparti de l'ancienne version, a travaillé 24 min, puis n'a pas pu enregistrer (conflit sur events.json).
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les sources et construire events.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: python3 build_events.py
      - name: Fabriquer les pages « Que faire à … ce week-end ? » de vivyo.app/sorties
        continue-on-error: true   # une erreur ici ne doit jamais bloquer la mise à jour des événements
        run: python3 build_sorties.py
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Mise à jour automatique des événements"
          # quelqu'un a pu envoyer un changement pendant le passage : on reprend la dernière version avant d'enregistrer.
          # Vrai conflit (le même fichier changé des deux côtés) : on n'écrase rien, on s'arrête ; le passage suivant refait tout.
          for essai in 1 2 3; do
            git push && exit 0
            [ "$essai" = 3 ] && break
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            sleep 5
          done
          exit 1
      - name: Vider la boîte de réception (propositions déjà enregistrées)
        env:
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: python3 build_events.py --ack
