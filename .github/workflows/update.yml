name: Mise à jour des événements

on:
  schedule:
    - cron: "0 4,10,16,22 * * *"   # quatre fois par jour : les propositions acceptées arrivent dans l'app en quelques heures
  workflow_dispatch:        # bouton « Run workflow » pour le lancer à la main
  push:                     # se relance tout seul quand le code du robot change
    paths:
      - "build_events.py"
      - "page_text.py"
      - "sources.json"
      - "facebook_searches.json"
      - "manual_events.json"
      - "inbox/**"

permissions:
  contents: write

# une seule exécution à la fois (évite les collisions à l'enregistrement)
concurrency:
  group: events-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire les sources et construire events.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 build_events.py
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Mise à jour automatique des événements" && git push)
      - name: Vider la boîte de réception (propositions déjà enregistrées)
        env:
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: python3 build_events.py --ack
